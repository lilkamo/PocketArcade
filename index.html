<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>POCKET ARCADE</title>
<meta name="description" content="Twelve tiny toys and games to kill a few minutes." />
<meta name="theme-color" content="#0a0612" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Arcade" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{
  --void:#0a0612;
  --void2:#120a20;
  --panel:#170e29;
  --panel2:#1f1436;
  --line:#2c1d49;
  --magenta:#ff2e88;
  --cyan:#27e6dd;
  --amber:#ffb347;
  --violet:#9b6dff;
  --ink:#efe9ff;
  --ink-dim:#a99fce;
  --ink-faint:#6f6593;
  --disp:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --mono:'Space Mono','SFMono-Regular',ui-monospace,monospace;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--void);
  color:var(--ink);
  font-family:var(--disp);
  overflow:hidden;
  position:fixed;inset:0;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;-moz-user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}
button,.tile,.bub,.scell{touch-action:manipulation;}
input,textarea{user-select:text;-webkit-user-select:text;}
#app{height:100%;display:flex;flex-direction:column;position:relative;z-index:1;}

/* ambient backdrop */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ---------- HOME ---------- */
.view{flex:1;display:flex;flex-direction:column;min-height:0;}
.view[hidden]{display:none;}

.home-head{
  padding:calc(var(--safe-t) + 22px) 20px 14px;
  flex:0 0 auto;
}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand h1{
  font-size:clamp(26px,8vw,42px);
  font-weight:700;letter-spacing:-.04em;line-height:.9;margin:0;
  background:linear-gradient(95deg,var(--magenta),var(--violet) 55%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 38px rgba(255,46,136,.25);
}
.head-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.count{
  display:flex;flex-direction:column;align-items:center;line-height:1;
  padding:9px 14px;border-radius:14px;
  background:linear-gradient(160deg,rgba(255,46,136,.16),rgba(39,230,221,.12));
  border:1px solid var(--line);position:relative;overflow:hidden;
}
.count b{font-family:var(--mono);font-size:22px;font-weight:700;
  background:linear-gradient(120deg,var(--magenta),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}
.count span{font-family:var(--mono);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);margin-top:3px;}
.surprise{
  appearance:none;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.04em;
  color:#0a0612;font-weight:700;border:none;border-radius:14px;padding:11px 14px;
  background:linear-gradient(120deg,var(--magenta),var(--violet));
  box-shadow:0 0 24px rgba(255,46,136,.35);display:flex;align-items:center;gap:7px;
  transition:transform .12s,filter .15s;
}
.surprise:active{transform:scale(.93);}
.surprise:hover{filter:brightness(1.08);}
.surprise svg{width:15px;height:15px;}
.tagline{margin:14px 2px 0;color:var(--ink-dim);font-size:14px;max-width:34ch;line-height:1.45;}

.shelves{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--safe-b) + 16px);
}
.shelf{margin-top:4px;}
.shelf-head{display:flex;align-items:baseline;gap:10px;padding:14px 20px 9px;}
.shelf-head h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--ink);}
.shelf-head .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-faint);
  border:1px solid var(--line);border-radius:99px;padding:2px 9px;}
.rail{
  display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;
  padding:4px 18px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  scroll-padding-left:18px;scroll-padding-right:18px;
  scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none;}

.tile{
  position:relative;flex:0 0 148px;width:148px;scroll-snap-align:start;
  border:none;cursor:pointer;text-align:left;
  border-radius:18px;padding:13px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--ink);font-family:inherit;
  display:flex;flex-direction:column;justify-content:flex-end;
  aspect-ratio:1/1;overflow:hidden;
  transition:transform .14s cubic-bezier(.2,.8,.3,1),box-shadow .2s;
  isolation:isolate;
}
.tile::before{
  content:"";position:absolute;inset:0;z-index:-1;opacity:.15;
  background:var(--g,linear-gradient(140deg,var(--magenta),var(--cyan)));
  transition:opacity .2s;
}
.tile::after{
  content:"";position:absolute;inset:auto -40% -55% -40%;height:75%;z-index:-1;
  background:radial-gradient(60% 100% at 50% 100%,var(--glow,rgba(255,46,136,.5)),transparent 70%);
  opacity:.38;filter:blur(6px);
}
.tile:active{transform:scale(.95);}
.tile:hover::before{opacity:.26;}
.tile:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.tile .ic{position:absolute;top:11px;right:11px;width:38px;height:38px;z-index:1;
  color:var(--accent,var(--magenta));opacity:.95;pointer-events:none;
  filter:drop-shadow(0 0 10px var(--glow,rgba(255,46,136,.55)));}
.tile .ic svg{width:100%;height:100%;display:block;}
.tile .meta{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.tile .nm{font-weight:700;font-size:14.5px;letter-spacing:-.015em;line-height:1.12;color:#fff;
  overflow-wrap:break-word;text-shadow:0 1px 8px rgba(0,0,0,.5);}
.tile .bl{font-size:11px;line-height:1.22;color:var(--ink-dim);overflow-wrap:break-word;}
.tile .tg{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px;}
.tile .fav{position:absolute;top:9px;left:9px;width:26px;height:26px;border:none;
  background:rgba(8,5,16,.5);color:var(--ink-dim);border-radius:50%;font-size:13px;cursor:pointer;
  z-index:2;display:flex;align-items:center;justify-content:center;line-height:1;
  opacity:.55;transition:opacity .15s,transform .12s,color .15s;}
.tile .fav:hover,.tile:hover .fav{opacity:.95;}
.tile .fav:active{transform:scale(.85);}
.tile .fav.on{color:#ffd93b;opacity:1;text-shadow:0 0 10px rgba(255,217,59,.7);background:rgba(60,40,10,.55);}
.hfav{appearance:none;flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-dim);font-size:15px;line-height:1;
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .12s,color .15s,border-color .15s;}
.hfav:active{transform:scale(.9);}
.hfav.on{color:#ffd93b;border-color:#ffd93b;text-shadow:0 0 10px rgba(255,217,59,.6);}

.home-foot{
  flex:0 0 auto;padding:0 22px calc(var(--safe-b) + 14px);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-faint);
  text-transform:uppercase;
}

/* ---------- STAGE ---------- */
#stage{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--void);}
#stage[hidden]{display:none;}
.bar{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:calc(var(--safe-t) + 12px) 16px 12px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--void2),var(--void));
}
.back{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  border-radius:11px;padding:9px 13px;cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:transform .12s,border-color .15s;
}
.back:active{transform:scale(.93);}
.back:hover{border-color:var(--accent,var(--magenta));}
.bar .ttl{font-weight:700;font-size:17px;letter-spacing:-.02em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar .hud{font-family:var(--mono);font-size:13px;color:var(--accent,var(--cyan));
  text-align:right;white-space:nowrap;line-height:1.2;}
.bar .hud small{display:block;color:var(--ink-faint);font-size:9px;letter-spacing:.16em;text-transform:uppercase;}
.info{appearance:none;flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);
  background:var(--panel);color:var(--accent,var(--cyan));font-family:var(--mono);font-weight:700;font-size:15px;
  border-radius:50%;cursor:pointer;transition:transform .12s,border-color .15s;}
.info:active{transform:scale(.9);}
.info:hover{border-color:var(--accent,var(--cyan));}
#helpSheet{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:26px;
  background:rgba(6,4,12,.74);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
#helpSheet[hidden]{display:none;}
.help-card{max-width:340px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.help-h{font-weight:700;font-size:21px;letter-spacing:-.02em;color:#fff;}
.help-b{color:var(--ink-dim);font-size:14.5px;line-height:1.55;}
.help-b b{color:var(--ink);}
#stageBody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;}

/* shared game furniture */
.gcanvas{display:block;width:100%;height:100%;touch-action:none;}
.fill{position:absolute;inset:0;}
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;}
.toolbar{flex:0 0 auto;display:flex;gap:9px;padding:12px 14px calc(var(--safe-b) + 14px);justify-content:center;flex-wrap:wrap;
  border-top:1px solid var(--line);background:var(--void2);}
.btn{
  appearance:none;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:12px;padding:11px 16px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;
}
.btn:active{transform:scale(.94);}
.btn:hover{border-color:var(--accent,var(--magenta));}
.btn.primary{background:var(--accent,var(--magenta));border-color:transparent;color:#0a0612;font-weight:700;}
.btn.primary:hover{filter:brightness(1.08);}
.bignum{font-family:var(--mono);font-weight:700;font-size:clamp(40px,16vw,86px);line-height:.95;letter-spacing:-.03em;}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);}
.hint{color:var(--ink-dim);font-size:14px;max-width:32ch;line-height:1.5;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.06s !important;}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="app">
  <!-- HOME -->
  <section class="view" id="home">
    <header class="home-head">
      <div class="head-row">
        <div class="brand">
          <h1>POCKET<br>ARCADE</h1>
        </div>
        <div class="head-actions">
          <button class="surprise" id="surprise" title="Play a random game">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.4" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.4" fill="currentColor" stroke="none"/></svg>
            Surprise me
          </button>
          <div class="count"><b id="gcount">0</b><span>games</span></div>
        </div>
      </div>
      <p class="tagline">A box of small things to fiddle with for a few minutes. Pick one — or roll the dice.</p>
    </header>
    <div class="shelves" id="shelves"></div>
    <footer class="home-foot">Add to home screen · scores saved on this device</footer>
  </section>

  <!-- STAGE -->
  <section id="stage" hidden>
    <div class="bar">
      <button class="back" id="backBtn">‹ Back</button>
      <div class="ttl" id="stageTitle"></div>
      <div class="hud" id="hud"></div>
      <button class="hfav" id="favBtn" aria-label="Favourite">★</button>
      <button class="info" id="infoBtn" aria-label="How to play">?</button>
    </div>
    <div id="stageBody"></div>
    <div id="helpSheet" hidden>
      <div class="help-card">
        <div class="help-h" id="helpTitle"></div>
        <div class="help-b" id="helpBody"></div>
        <button class="btn primary" id="helpClose">Got it</button>
      </div>
    </div>
  </section>
</div>

<script>
"use strict";
/* ===================================================================
   POCKET ARCADE  —  single-file mini-arcade
   Shell: storage, haptics, audio, canvas helper, router
=================================================================== */

/* ---- storage: localStorage on a real host (e.g. GitHub Pages),
        silent in-memory fallback in sandboxed previews ---- */
const store = (() => {
  let mem = {}, ok = true;
  try { const k = "__arc_test"; localStorage.setItem(k, "1"); localStorage.removeItem(k); }
  catch (e) { ok = false; }
  return {
    get(k, d) {
      try {
        if (ok) { const v = localStorage.getItem("arc_" + k); return v == null ? d : JSON.parse(v); }
        return k in mem ? mem[k] : d;
      } catch (e) { return d; }
    },
    set(k, v) {
      try { if (ok) localStorage.setItem("arc_" + k, JSON.stringify(v)); else mem[k] = v; }
      catch (e) { mem[k] = v; }
    }
  };
})();

/* ---- haptics ---- */
function buzz(ms = 12) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

/* ---- audio: tiny synth blips, lazily created on first gesture ---- */
let actx = null;
function audioReady() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function tone(freq = 440, dur = 0.07, type = "square", vol = 0.05) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime; o.start(t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.stop(t + dur + 0.02);
  } catch (e) {}
}
/* ---- favourites ---- */
function getFavs() { return store.get("favs", []) || []; }
function isFav(id) { return getFavs().includes(id); }
function toggleFav(id) {
  const arr = getFavs(), i = arr.indexOf(id);
  if (i >= 0) arr.splice(i, 1); else arr.push(id);
  store.set("favs", arr); buzz(10);
  return i < 0;
}

window.addEventListener("pointerdown", audioReady, { once: false });

/* ---- stop the browser hijacking taps: no pinch-zoom, no double-tap zoom ---- */
["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
let _lastTouch = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - _lastTouch < 320) e.preventDefault(); // kills double-tap zoom
  _lastTouch = now;
}, { passive: false });
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });

/* ---- helpers ---- */
const rand = (a, b) => a + Math.random() * (b - a);
const randint = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randint(0, i);[a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmt(n) {
  if (n < 1000) return (Math.floor(n)).toString();
  const u = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx"]; let i = 0;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + u[i];
}

/* requestAnimationFrame loop with a stop() */
function loop(fn) {
  let id, running = true, last = performance.now();
  const tick = now => {
    if (!running) return;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    fn(dt, now); id = requestAnimationFrame(tick);
  };
  id = requestAnimationFrame(tick);
  return () => { running = false; cancelAnimationFrame(id); };
}

/* canvas sized to its parent with devicePixelRatio handling */
function makeCanvas(root) {
  const c = document.createElement("canvas");
  c.className = "gcanvas"; root.appendChild(c);
  const ctx = c.getContext("2d");
  let w = 0, h = 0;
  function resize() {
    const r = root.getBoundingClientRect();
    w = Math.max(1, r.width); h = Math.max(1, r.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  const ro = new ResizeObserver(resize); ro.observe(root);
  return {
    canvas: c, ctx, resize,
    get W() { return w; }, get H() { return h; },
    pointer(e) { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; },
    destroy() { ro.disconnect(); }
  };
}

/* HUD helper passed to each game */
const hudEl = document.getElementById("hud");
function hud(main, sub) {
  hudEl.innerHTML = sub ? `<small>${sub}</small>${main}` : (main || "");
}

/* ===================================================================
   GAME REGISTRY  (definitions appended below; each game pushes here)
=================================================================== */
const GAMES = [];
function defGame(def) { GAMES.push(def); }

/* ===================================================================
   ROUTER
=================================================================== */
const homeEl = document.getElementById("home");
const stageEl = document.getElementById("stage");
const stageBody = document.getElementById("stageBody");
const stageTitle = document.getElementById("stageTitle");
const infoBtn = document.getElementById("infoBtn");
const helpSheet = document.getElementById("helpSheet");
const helpTitle = document.getElementById("helpTitle");
const helpBody = document.getElementById("helpBody");
function showHelp() { if (!activeGame || !HELP[activeGame.id]) return; helpTitle.textContent = activeGame.name; helpBody.innerHTML = HELP[activeGame.id]; helpSheet.hidden = false; buzz(8); }
function hideHelp() { helpSheet.hidden = true; }
infoBtn.addEventListener("click", showHelp);
document.getElementById("helpClose").addEventListener("click", hideHelp);
helpSheet.addEventListener("click", e => { if (e.target === helpSheet) hideHelp(); });
const favBtn = document.getElementById("favBtn");
function refreshFavBtn() { if (!activeGame) return; favBtn.classList.toggle("on", isFav(activeGame.id)); }
favBtn.addEventListener("click", () => { if (!activeGame) return; const now = toggleFav(activeGame.id); favBtn.classList.toggle("on", now); buildHome(); });
let cleanup = null, activeGame = null;
const canRoute = /^https?:$/.test(location.protocol); // false inside sandboxed previews

function openGame(id) {
  const g = GAMES.find(x => x.id === id); if (!g) return;
  activeGame = g;
  document.documentElement.style.setProperty("--accent", g.accent);
  document.documentElement.style.setProperty("--glow", g.glow);
  stageTitle.textContent = g.name;
  infoBtn.style.display = HELP[g.id] ? "" : "none";
  refreshFavBtn();
  hud("");
  homeEl.hidden = true; stageEl.hidden = false;
  stageBody.innerHTML = "";
  buzz(8);
  try { cleanup = g.mount(stageBody) || null; }
  catch (e) { stageBody.innerHTML = `<div class="center-col"><p class="hint">This toy hit a snag: ${e.message}</p></div>`; }
  if (canRoute) { try { history.replaceState(null, "", "#" + id); } catch (e) {} }
}
function closeGame() {
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  activeGame = null;
  hideHelp();
  stageBody.innerHTML = "";
  stageEl.hidden = true; homeEl.hidden = false;
  hud("");
  if (canRoute && location.hash) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
}
document.getElementById("backBtn").addEventListener("click", () => { buzz(8); closeGame(); });
window.addEventListener("popstate", () => { if (!stageEl.hidden) closeGame(); });

/* build home grid (after games register, see bottom bootstrap) */
const BLURBS = {
  balldrop: "Spawn bouncing balls",
  bubblewrap: "Pop, repeat, refill",
  kaleido: "Draw in mirror symmetry",
  blob: "Squish a jelly blob",
  watt: "Tap, then automate",
  garden: "Grow a flower, slowly",
  react: "Test your reflexes",
  aim: "Hit targets, beat the clock",
  stack: "Build the tower high",
  schulte: "Find 1 to 25, fast",
  wheel: "Spin to decide",

function makeTile(g) {
  const b = document.createElement("button");
  b.className = "tile";
  b.style.setProperty("--g", `linear-gradient(140deg, ${g.accent}, ${g.accent2 || g.glow})`);
  b.style.setProperty("--accent", g.accent);
  b.style.setProperty("--glow", g.glow);
  const sub = (g.tag.split("·")[1] || "").trim();
  b.innerHTML = `<button class="fav${isFav(g.id) ? " on" : ""}" aria-label="Favourite">★</button>
    <span class="ic">${g.icon}</span>
    <span class="meta">
      <span class="nm">${g.name}</span>
      <span class="bl">${BLURBS[g.id] || ""}</span>
      ${sub ? `<span class="tg">${sub}</span>` : ""}
    </span>`;
  const star = b.querySelector(".fav");
  star.addEventListener("click", e => { e.stopPropagation(); const now = toggleFav(g.id); star.classList.toggle("on", now); buildHome(); if (activeGame && activeGame.id === g.id) refreshFavBtn(); });
  b.addEventListener("click", () => openGame(g.id));
  return b;
}
const CATS = [
  { name: "Fidgets", match: ["Fidget"] },
  { name: "Toys", match: ["Toy"] },
  { name: "Idle & clickers", match: ["Idle"] },
  { name: "Puzzles", match: ["Puzzle"] },
  { name: "Skill & arcade", match: ["Skill"] },
  { name: "Brain & quick", match: ["Brain", "Quick"] }
];
const catOf = g => (g.tag.split("·")[0] || "").trim();
function shelf(title, games) {
  const sec = document.createElement("section"); sec.className = "shelf";
  const head = document.createElement("div"); head.className = "shelf-head";
  head.innerHTML = `<h2>${title}</h2><span class="cnt">${games.length}</span>`;
  const rail = document.createElement("div"); rail.className = "rail";
  games.forEach(g => rail.appendChild(makeTile(g)));
  sec.append(head, rail); return sec;
}
function buildHome() {
  const root = document.getElementById("shelves");
  root.innerHTML = "";
  const favs = getFavs().map(id => GAMES.find(g => g.id === id)).filter(Boolean);
  if (favs.length) root.appendChild(shelf("★ Favourites", favs));
  const used = new Set();
  CATS.forEach(cat => {
    const games = GAMES.filter(g => cat.match.includes(catOf(g)));
    if (!games.length) return;
    games.forEach(g => used.add(g.id));
    root.appendChild(shelf(cat.name, games));
  });
  const rest = GAMES.filter(g => !used.has(g.id));
  if (rest.length) root.appendChild(shelf("More", rest));
  const gc = document.getElementById("gcount");
  if (gc) gc.textContent = GAMES.length;
  const sp = document.getElementById("surprise");
  if (sp && !sp._wired) { sp._wired = true; sp.addEventListener("click", () => { buzz(12); openGame(pick(GAMES).id); }); }
}

function stageLayout(root, { toolbar = true } = {}) {

const PAL = ["#ff2e88", "#27e6dd", "#ffb347", "#9b6dff", "#5cff9d", "#ff7b54"];

/* ============ 1. BALL DROP ============ */
defGame({
  id: "balldrop", name: "Ball Drop", tag: "Fidget · physics", accent: "#ff2e88", glow: "rgba(255,46,136,.5)",
  icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="7" r="3.2"/><circle cx="15" cy="14" r="3.6"/><circle cx="7.5" cy="17" r="2.4"/></svg>`,
  mount(root) {
    const { area, tb } = stageLayout(root);
    const cv = makeCanvas(area), ctx = cv.ctx;
    let balls = [], gx = 0, gy = 1100, tiltOn = false, oh = null, popping = false, popAt = 0;
    const MAX = 140;
    function spawn(x, y) {
      if (popping) return;
      const r = rand(11, 23);
      balls.push({ x, y, vx: rand(-160, 160), vy: rand(-40, 60), r, c: pick(PAL) });
      buzz(6); tone(rand(220, 520), .05, "sine", .04);
      if (balls.length >= MAX) burst();
    }
    function burst() {
      popping = true; popAt = performance.now(); buzz(80); tone(110, .3, "sawtooth", .06);
      balls.forEach(b => { b.vx += rand(-500, 500); b.vy -= rand(250, 750); });
      setTimeout(() => { balls = []; popping = false; buzz(20); }, 720);
    }
    cv.canvas.addEventListener("pointerdown", e => { const p = cv.pointer(e); for (let i = 0; i < 3; i++) spawn(p.x + rand(-10, 10), p.y + rand(-10, 10)); });
    const stop = loop((dt, now) => {
      const W = cv.W, H = cv.H; ctx.clearRect(0, 0, W, H);
      for (const b of balls) {
        b.vx += gx * dt; b.vy += gy * dt; b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.x < b.r) { b.x = b.r; b.vx *= -.6; } if (b.x > W - b.r) { b.x = W - b.r; b.vx *= -.6; }
        if (b.y > H - b.r) { b.y = H - b.r; b.vy *= -.52; b.vx *= .98; } if (b.y < b.r) { b.y = b.r; b.vy *= -.5; }
      }
      if (!popping) for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], b = balls[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), mn = a.r + b.r;
        if (d > 0 && d < mn) {
          const nx = dx / d, ny = dy / d, ov = (mn - d) / 2;
          a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
          const p = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (p < 0) { const e = .75; a.vx += p * nx * e; a.vy += p * ny * e; b.vx -= p * nx * e; b.vy -= p * ny * e; }
        }
      }
      const a = popping ? clamp(1 - (now - popAt) / 720, 0, 1) : 1;
      ctx.globalAlpha = a;
      for (const b of balls) {
        const g = ctx.createRadialGradient(b.x - b.r * .3, b.y - b.r * .3, b.r * .15, b.x, b.y, b.r);
        g.addColorStop(0, "#fff"); g.addColorStop(.28, b.c); g.addColorStop(1, b.c);
        ctx.fillStyle = g; ctx.shadowColor = b.c; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      }
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      hud(balls.length + "/" + MAX, popping ? "POP!" : "balls");
    });
    const drop = document.createElement("button"); drop.className = "btn primary"; drop.textContent = "Drop a few";
    drop.onclick = () => { for (let i = 0; i < 4; i++) spawn(rand(cv.W * .3, cv.W * .7), 30); };
    const clr = document.createElement("button"); clr.className = "btn"; clr.textContent = "Clear";
    clr.onclick = () => { balls = []; buzz(10); };
    const tilt = document.createElement("button"); tilt.className = "btn"; tilt.textContent = "Tilt: off";
    tilt.onclick = async () => {
      if (!tiltOn) {
        try {
          if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) {
            const r = await DeviceOrientationEvent.requestPermission(); if (r !== "granted") return;
          }
          oh = ev => { gx = clamp((ev.gamma || 0) / 45, -1, 1) * 1100; gy = clamp((ev.beta || 0) / 45, -1, 1) * 700 + 350; };
          window.addEventListener("deviceorientation", oh); tiltOn = true; tilt.textContent = "Tilt: on"; buzz(10);
        } catch (e) {}
      } else { window.removeEventListener("deviceorientation", oh); oh = null; gx = 0; gy = 1100; tiltOn = false; tilt.textContent = "Tilt: off"; buzz(10); }
    };
    tb.append(drop, clr, tilt);
    return () => { stop(); cv.destroy(); if (oh) window.removeEventListener("deviceorientation", oh); };
  }
});

/* ============ 3. KALEIDOSCOPE ============ */
defGame({
  id: "kaleido", name: "Kaleidoscope", tag: "Toy · draw", accent: "#9b6dff", glow: "rgba(155,109,255,.5)",
  icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg>`,
  mount(root) {
    const { area, tb } = stageLayout(root);
    const cv = makeCanvas(area), ctx = cv.ctx;
    let seg = 8, hue = rand(0, 360), drawing = false, last = null;
    const map = (px, py, a, mir) => { const x = px, y = mir ? -py : py; return { x: x * Math.cos(a) - y * Math.sin(a), y: x * Math.sin(a) + y * Math.cos(a) }; };
    function draw(p) {
      const cx = cv.W / 2, cy = cv.H / 2;
      if (!last) { last = p; return; }
      hue = (hue + 2.5) % 360;
      ctx.strokeStyle = `hsl(${hue} 90% 62%)`; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.shadowColor = `hsl(${hue} 90% 62%)`; ctx.shadowBlur = 9;
      const ax = last.x - cx, ay = last.y - cy, bx = p.x - cx, by = p.y - cy;
      for (let i = 0; i < seg; i++) {
        const a = (Math.PI * 2 / seg) * i;
        for (const mir of [false, true]) {
          const A = map(ax, ay, a, mir), B = map(bx, by, a, mir);
          ctx.beginPath(); ctx.moveTo(cx + A.x, cy + A.y); ctx.lineTo(cx + B.x, cy + B.y); ctx.stroke();
        }
      }
      ctx.shadowBlur = 0; last = p;
    }
    cv.canvas.addEventListener("pointerdown", e => { drawing = true; last = null; draw(cv.pointer(e)); });
    cv.canvas.addEventListener("pointermove", e => { if (drawing) draw(cv.pointer(e)); });
    window.addEventListener("pointerup", () => { drawing = false; last = null; });
    hud(seg + "-fold", "symmetry");
    [6, 8, 12].forEach(n => {
      const btn = document.createElement("button"); btn.className = "btn" + (n === seg ? " primary" : "");
      btn.textContent = n + "-fold";
      btn.onclick = () => { seg = n; buzz(8); hud(seg + "-fold", "symmetry"); [...tb.children].forEach(c => c.classList.remove("primary")); btn.classList.add("primary"); };
      tb.append(btn);
    });
    const clr = document.createElement("button"); clr.className = "btn"; clr.textContent = "Clear";
    clr.onclick = () => { ctx.clearRect(0, 0, cv.W, cv.H); buzz(10); };
    tb.append(clr);
    return () => cv.destroy();
  }
});

/* ============ 4. GOO BLOB ============ */
defGame({
  id: "blob", name: "Goo", tag: "Fidget · jelly", accent: "#5cff9d", glow: "rgba(92,255,157,.5)",
  icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3c4 0 7 2.5 7 6.5 0 3-2 4-2 6.5S14 21 12 21s-5-.5-5-5 -2-3.5-2-6.5C5 5.5 8 3 12 3Z"/></svg>`,
  mount(root) {
    const { area, tb } = stageLayout(root);
    const cv = makeCanvas(area), ctx = cv.ctx;
    const N = 28; let cx = cv.W / 2, cy = cv.H / 2, cxv = 0, cyv = 0, tx = cx, ty = cy, drag = false, amp = 0, t = 0, hue = rand(120, 200);
    cv.canvas.addEventListener("pointerdown", e => { const p = cv.pointer(e); tx = p.x; ty = p.y; drag = true; amp = Math.min(1, amp + .5); buzz(10); tone(rand(120, 240), .12, "sine", .05); });
    cv.canvas.addEventListener("pointermove", e => { if (drag) { const p = cv.pointer(e); tx = p.x; ty = p.y; } });
    window.addEventListener("pointerup", () => { drag = false; });
    const stop = loop(dt => {
      const W = cv.W, H = cv.H; t += dt; ctx.clearRect(0, 0, W, H);
      const gx = drag ? tx : W / 2, gy = drag ? ty : H / 2;
      const ax = (gx - cx) * 60, ay = (gy - cy) * 60;
      cxv = (cxv + ax * dt) * .9; cyv = (cyv + ay * dt) * .9;
      cx += cxv * dt; cy += cyv * dt;
      amp = Math.max(0, amp - dt * 1.2);
      const R = Math.min(W, H) * .2;
      const sx = clamp(-cxv * .0006, -.35, .35), sy = clamp(-cyv * .0006, -.35, .35);
      const P = [];
      for (let i = 0; i < N; i++) {
        const a = i / N * Math.PI * 2;
        const wob = 1 + .09 * Math.sin(t * 2.4 + i * .8) + amp * .18 * Math.sin(t * 9 + i);
        let r = R * wob;
        const dx = Math.cos(a), dy = Math.sin(a);
        const st = 1 + sx * dx + sy * dy;
        P.push({ x: cx + dx * r * st, y: cy + dy * r * st });

/* ============ 9. STACK ============ */
defGame({
  id: "stack", name: "Stack", tag: "Skill · tower", accent: "#9b6dff", glow: "rgba(155,109,255,.5)",
  icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="15" width="14" height="4" rx="1"/><rect x="7" y="10" width="11" height="4" rx="1"/><rect x="6" y="5" width="9" height="4" rx="1"/></svg>`,
  mount(root) {
    const { area } = stageLayout(root, { toolbar: false });
    const cv = makeCanvas(area), ctx = cv.ctx;
    const BH = 30; let best = store.get("stack_best", 0);
    let blocks, moving, speed, score, over, falling;
    function reset() {
      const w = cv.W, bw = Math.min(w * .5, 200);
      blocks = [{ x: (w - bw) / 2, w: bw }];
      speed = w * .55; score = 0; over = false; falling = [];
      moving = { x: 0, w: bw, dir: 1 };
      hud(score, "best " + best);
    }
    reset();
    function drop() {
      if (over) { reset(); return; }
      const top = blocks[blocks.length - 1];
      const l = Math.max(moving.x, top.x), r = Math.min(moving.x + moving.w, top.x + top.w), ov = r - l;
      if (ov <= 0) {
        over = true; if (score > best) { best = score; store.set("stack_best", best); }
        buzz(60); tone(120, .2, "sawtooth", .05); hud(score, "best " + best); return;
      }
      // trimmed piece falls
      if (moving.x < l) falling.push({ x: moving.x, w: l - moving.x, y: blockY(blocks.length), vy: 0, hue: hueAt(blocks.length) });
      if (moving.x + moving.w > r) falling.push({ x: r, w: moving.x + moving.w - r, y: blockY(blocks.length), vy: 0, hue: hueAt(blocks.length) });
      blocks.push({ x: l, w: ov }); score++; speed += cv.W * .02;
      buzz(12); tone(300 + score * 12, .05, "square", .05); hud(score, "best " + best);
      moving = { x: 0, w: ov, dir: 1 };
    }
    const hueAt = i => 250 + i * 9;
    function camera() { return Math.max(0, blocks.length * BH - cv.H * .55); }
    function blockY(i) { return cv.H - BH - i * BH + camera(); }
    cv.canvas.addEventListener("pointerdown", () => { audioReady(); drop(); });
    const stop = loop(dt => {
      const W = cv.W, H = cv.H; ctx.clearRect(0, 0, W, H);
      if (!over) {
        moving.x += moving.dir * speed * dt;
        if (moving.x < 0) { moving.x = 0; moving.dir = 1; } if (moving.x + moving.w > W) { moving.x = W - moving.w; moving.dir = -1; }
      }
      const cam = camera();
      blocks.forEach((b, i) => { drawBlock(b.x, H - BH - i * BH + cam, b.w, hueAt(i)); });
      if (!over) drawBlock(moving.x, H - BH - blocks.length * BH + cam, moving.w, hueAt(blocks.length), true);
      falling.forEach(f => { f.vy += 1400 * dt; f.y += f.vy * dt; drawBlock(f.x, f.y, f.w, f.hue); });
      falling = falling.filter(f => f.y < H + 60);
      if (over) {
        ctx.fillStyle = "rgba(10,6,18,.78)"; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#efe9ff"; ctx.textAlign = "center";
        ctx.font = "700 56px 'Space Mono',monospace"; ctx.fillText(score, W / 2, H / 2 - 6);
        ctx.font = "13px 'Space Mono',monospace"; ctx.fillStyle = "#a99fce";
        ctx.fillText("BLOCKS · BEST " + best, W / 2, H / 2 + 26);
        ctx.fillText("tap to play again", W / 2, H / 2 + 56);
      }
    });
    function drawBlock(x, y, w, hue, glow) {
      ctx.fillStyle = `hsl(${hue} 70% 60%)`;
      if (glow) { ctx.shadowColor = `hsl(${hue} 80% 60%)`; ctx.shadowBlur = 16; }
      ctx.fillRect(x, y, w, BH - 3); ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(x, y, w, 4);
    }
    return () => { stop(); cv.destroy(); };
  }
});

/* ============ 11. DECISION WHEEL ============ */
defGame({
  id: "wheel", name: "Decision Wheel", tag: "Toy · spin", accent: "#27e6dd", glow: "rgba(39,230,221,.5)",
  icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>`,
  mount(root) {
    const { area, tb } = stageLayout(root);
    const cv = makeCanvas(area), ctx = cv.ctx;
    let opts = store.get("wheel_opts", ["Yes", "No", "Maybe", "Ask later", "Definitely", "No way"]);
    let rot = rand(0, 7), vel = 0, spinning = false, winner = -1, editing = false;
    const cols = ["#ff2e88", "#27e6dd", "#ffb347", "#9b6dff", "#5cff9d", "#ff7b54", "#6db8ff", "#ff5ca8"];
    function draw() {
      const W = cv.W, H = cv.H, cx = W / 2, cy = H / 2, R = Math.min(W, H) * .42, n = opts.length, seg = Math.PI * 2 / n;
      ctx.clearRect(0, 0, W, H);
      for (let i = 0; i < n; i++) {
        const a0 = rot + i * seg;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a0 + seg); ctx.closePath();
        ctx.fillStyle = cols[i % cols.length]; ctx.fill();
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + seg / 2);
        ctx.fillStyle = "#0a0612"; ctx.font = "700 15px 'Space Grotesk',sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
        ctx.fillText(opts[i].slice(0, 14), R - 14, 0); ctx.restore();
      }
      ctx.beginPath(); ctx.arc(cx, cy, R * .14, 0, 7); ctx.fillStyle = "#170e29"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#efe9ff"; ctx.stroke();
      // marker (top)
      ctx.beginPath(); ctx.moveTo(cx, cy - R - 12); ctx.lineTo(cx - 12, cy - R + 10); ctx.lineTo(cx + 12, cy - R + 10); ctx.closePath();
      ctx.fillStyle = "#efe9ff"; ctx.fill();
    }
    const stop = loop(dt => {
      if (spinning) {
        rot += vel * dt; vel *= Math.pow(0.4, dt); // friction
        if (vel < 0.15) { spinning = false; vel = 0; settle(); }
      }

  mount(root) {
    const { area, tb } = stageLayout(root);
    const cv = makeCanvas(area), ctx = cv.ctx;
    let scroll = 0, stars = [], cfg;
    function shuffle2() {
      cfg = { h1: rand(280, 340), h2: rand(170, 210), spd: rand(.25, .6), sunY: rand(.28, .4) };
      stars = []; for (let i = 0; i < 70; i++) stars.push({ x: Math.random(), y: Math.random() * .42, s: rand(.5, 1.8), tw: rand(0, 7) });
      buzz(8);
    }
    shuffle2();
    cv.canvas.addEventListener("pointerdown", shuffle2);
    const stop = loop((dt, now) => {
      const W = cv.W, H = cv.H, hz = H * .46; scroll = (scroll + dt * cfg.spd) % 1;
      const sky = ctx.createLinearGradient(0, 0, 0, hz);
      sky.addColorStop(0, `hsl(${cfg.h1} 60% 8%)`); sky.addColorStop(1, `hsl(${cfg.h1} 70% 22%)`);
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hz);

      stars.forEach(s => { const tw = .5 + .5 * Math.sin(now / 600 + s.tw); ctx.globalAlpha = tw; ctx.fillStyle = "#fff"; ctx.fillRect(s.x * W, s.y * hz, s.s, s.s); });
      ctx.globalAlpha = 1;
      // sun
      const scx = W / 2, scy = hz * cfg.sunY + hz * .12, sr = Math.min(W, H) * .16;
      const sg = ctx.createLinearGradient(0, scy - sr, 0, scy + sr);
      sg.addColorStop(0, `hsl(${cfg.h1} 90% 70%)`); sg.addColorStop(1, `hsl(${cfg.h2 + 30} 90% 55%)`);
      ctx.save(); ctx.beginPath(); ctx.arc(scx, scy, sr, 0, 7); ctx.clip(); ctx.fillStyle = sg; ctx.fillRect(scx - sr, scy - sr, sr * 2, sr * 2);
      ctx.fillStyle = `hsl(${cfg.h1} 60% 10%)`;
      for (let i = 0; i < 7; i++) { const y = scy + sr * .1 + i * (sr * .16); ctx.fillRect(scx - sr, y, sr * 2, clamp(2 + i * 1.2, 2, 9)); }
      ctx.restore();
      // ground
      ctx.fillStyle = `hsl(${cfg.h2} 50% 6%)`; ctx.fillRect(0, hz, W, H - hz);
      ctx.strokeStyle = `hsl(${cfg.h2} 90% 60%)`; ctx.lineWidth = 1.5; ctx.shadowColor = `hsl(${cfg.h2} 90% 60%)`; ctx.shadowBlur = 8;

  }
});

/* ===================================================================
   SHARED HELPERS FOR THE NEW BATCH
=================================================================== */
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function swipeDir(el, cb) {
  let sx = 0, sy = 0, on = false;
  el.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; on = true; });
  el.addEventListener("pointerup", e => {
    if (!on) return; on = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.hypot(dx, dy) < 24) return;
    cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U"));
  });
}

    let cell, cols, rows, snake, dir, ndir, food, over, score, best = store.get("snake_best", 0), acc, speed;
    function setup() {
      cell = Math.floor(Math.min(cv.W, cv.H) / 22) || 14;
      cols = Math.max(6, Math.floor(cv.W / cell)); rows = Math.max(6, Math.floor(cv.H / cell));
      snake = [{ x: Math.floor(cols / 2), y: Math.floor(rows / 2) }]; dir = { x: 1, y: 0 }; ndir = dir;
      score = 0; over = false; speed = 8; acc = 0; placeFood(); hud(0, "best " + best);
    }
    function placeFood() { do { food = { x: randint(0, cols - 1), y: randint(0, rows - 1) }; } while (snake.some(s => s.x === food.x && s.y === food.y)); }
    function step() {
      dir = ndir; const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows || snake.some(s => s.x === head.x && s.y === head.y)) { over = true; if (score > best) { best = score; store.set("snake_best", best); } buzz(60); tone(140, .2, "sawtooth", .05); hud(score, "best " + best); return; }

    });
    function turn(d) { const map = { L: { x: -1, y: 0 }, R: { x: 1, y: 0 }, U: { x: 0, y: -1 }, D: { x: 0, y: 1 } }, nd = map[d]; if (!nd) return; if (nd.x === -dir.x && nd.y === -dir.y) return; ndir = nd; }

/* ============ 19. PLINKO ============ */
defGame({
  id: "plinko", name: "Plinko", tag: "Toy · drop", accent: "#9b6dff", glow: "rgba(155,109,255,.5)",
  icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="3" r="1.4" fill="currentColor"/><circle cx="6" cy="9" r="1"/><circle cx="12" cy="9" r="1"/><circle cx="18" cy="9" r="1"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/><path d="M4 20h16"/></svg>`,
  mount(root) {
    const { area, tb } = stageLayout(root);
    const cv = makeCanvas(area), ctx = cv.ctx;
    let pegs = [], balls = [], bins = new Array(6).fill(0), lw = 0;
    function build() {
      pegs = []; const W = cv.W, H = cv.H, rows = 8, top = H * .16, bottom = H * .76, gapY = (bottom - top) / rows;
      for (let r = 0; r < rows; r++) { const n = r + 3, sp = W / (n + 1), y = top + r * gapY; for (let i = 0; i < n; i++) pegs.push({ x: sp * (i + 1), y }); }
      lw = W;
    }
    function drop(x) { balls.push({ x: clamp(x, 12, cv.W - 12), y: 8, vx: rand(-20, 20), vy: 0, r: 7, c: pick(PAL) }); if (balls.length > 40) balls.shift(); buzz(8); }
    cv.canvas.addEventListener("pointerdown", e => drop(cv.pointer(e).x));
    const stop = loop(dt => {
      const W = cv.W, H = cv.H; if (Math.abs(W - lw) > 2) build();
      ctx.clearRect(0, 0, W, H);

      const by = H * .8, nb = bins.length, bw = W / nb;
      ctx.strokeStyle = "#2c1d49"; ctx.lineWidth = 2;
      for (let i = 0; i <= nb; i++) { ctx.beginPath(); ctx.moveTo(i * bw, by); ctx.lineTo(i * bw, H); ctx.stroke(); }
      ctx.fillStyle = "#a99fce"; ctx.font = "13px 'Space Mono',monospace"; ctx.textAlign = "center";

      balls.forEach(b => {
        b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
        for (const p of pegs) { const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy), mn = b.r + 3; if (d > 0 && d < mn) { const nx = dx / d, ny = dy / d; b.x = p.x + nx * mn; b.y = p.y + ny * mn; const dot = b.vx * nx + b.vy * ny; b.vx = (b.vx - 2 * dot * nx) * .6 + rand(-15, 15); b.vy = (b.vy - 2 * dot * ny) * .6; if (Math.random() < .3) tone(rand(500, 900), .03, "sine", .03); } }
        if (b.x < b.r) { b.x = b.r; b.vx *= -.5; } if (b.x > W - b.r) { b.x = W - b.r; b.vx *= -.5; }
        if (b.y > by && !b.done) { b.done = true; bins[clamp(Math.floor(b.x / bw), 0, nb - 1)]++; buzz(14); tone(300, .06, "square", .04); }
        const g = ctx.createRadialGradient(b.x - b.r * .3, b.y - b.r * .3, b.r * .2, b.x, b.y, b.r); g.addColorStop(0, "#fff"); g.addColorStop(.3, b.c); g.addColorStop(1, b.c);
        ctx.fillStyle = g; ctx.shadowColor = b.c; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      });
      balls = balls.filter(b => b.y < H + 30);
      hud(bins.reduce((a, b) => a + b, 0), "dropped");
    });
    const d3 = document.createElement("button"); d3.className = "btn primary"; d3.textContent = "Drop 3"; d3.onclick = () => { for (let i = 0; i < 3; i++) drop(rand(cv.W * .3, cv.W * .7)); };
    const clr = document.createElement("button"); clr.className = "btn"; clr.textContent = "Reset bins"; clr.onclick = () => { bins = bins.map(() => 0); buzz(10); };
    tb.append(d3, clr);
    return () => { stop(); cv.destroy(); };
  }
});

defGame({
  id: "beats", name: "Beat Pad", tag: "Toy · sound", accent: "#27e6dd", glow: "rgba(39,230,221,.5)",
  icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,

    const grid = document.createElement("div"); grid.style.cssText = "display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(92vw,420px);";
    const notes = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3, 784, 880, 1046.5, 1174.7];

function hsl2rgb(h, s, l) {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);

}

defGame({
  id: "connect4", name: "Connect Four", tag: "Puzzle · vs AI", accent: "#ffd93b", glow: "rgba(255,217,59,.5)",
  icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.6"/><circle cx="12" cy="9" r="1.6"/><circle cx="8" cy="14" r="1.6" fill="currentColor"/><circle cx="12" cy="14" r="1.6" fill="currentColor"/><circle cx="16" cy="14" r="1.6"/></svg>`,
  mount(root) {
    const { area, tb } = stageLayout(root);
    const wrap = document.createElement("div"); wrap.style.cssText = "flex:1;display:flex;align-items:center;justify-content:center;padding:12px;"; area.appendChild(wrap);
    const C = 7, R = 6; let bd, over, els = [], turn;
    const boardEl = document.createElement("div"); boardEl.style.cssText = `display:grid;grid-template-columns:repeat(${C},1fr);grid-template-rows:repeat(${R},1fr);gap:5px;width:min(94vw,430px);aspect-ratio:${C}/${R};background:#1a2b6b;padding:6px;border-radius:12px;`; wrap.appendChild(boardEl);
    function reset() { bd = new Array(C * R).fill(0); over = false; turn = 1; build(); hud("your turn", "yellow = you"); }
    function build() { boardEl.innerHTML = ""; els = []; for (let i = 0; i < C * R; i++) { const d = document.createElement("button"); d.style.cssText = "aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;"; d.addEventListener("pointerdown", () => drop(i % C)); boardEl.appendChild(d); els.push(d); } render(); }
    function render() { for (let i = 0; i < C * R; i++) { const v = bd[i]; els[i].style.background = v === 1 ? "#ffd93b" : v === 2 ? "#ff2e88" : "#0d0818"; els[i].style.boxShadow = v ? `0 0 10px ${v === 1 ? "#ffd93b" : "#ff2e88"}66` : "none"; } }
    function dropRow(col) { for (let r = R - 1; r >= 0; r--) if (!bd[r * C + col]) return r; return -1; }
    function place(col, p) { const r = dropRow(col); if (r < 0) return -1; bd[r * C + col] = p; return r * C + col; }
    function win(p) { const at = (r, c) => (r >= 0 && r < R && c >= 0 && c < C) ? bd[r * C + c] : -1; for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { if (at(r, c) !== p) continue; for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) { let n = 1; for (let k = 1; k < 4; k++) { if (at(r + dr * k, c + dc * k) === p) n++; else break; } if (n >= 4) return true; } } return false; }
    function full() { return bd.every(x => x); }
    function aiMove() {
      const valid = [...Array(C).keys()].filter(c => dropRow(c) >= 0);
      for (const c of valid) { const i = place(c, 2); if (win(2)) return; bd[i] = 0; }
      for (const c of valid) { const i = place(c, 1); const w = win(1); bd[i] = 0; if (w) { place(c, 2); return; } }
      const order = [3, 2, 4, 1, 5, 0, 6].filter(c => valid.includes(c)); place(pick(order.slice(0, Math.min(3, order.length))) ?? valid[0], 2);
    }
    function drop(col) {
      if (over || turn !== 1 || dropRow(col) < 0) return; place(col, 1); render(); buzz(10); tone(440, .04, "square", .05);
      if (win(1)) { over = true; render(); hud("you win!", ""); buzz(40); return; } if (full()) { over = true; hud("draw", ""); return; }
      turn = 2; setTimeout(() => { aiMove(); render(); if (win(2)) { over = true; hud("AI wins", ""); buzz(40); } else if (full()) { over = true; hud("draw", ""); } else turn = 1; }, 300);
    }
    reset();
    const nw = document.createElement("button"); nw.className = "btn primary"; nw.textContent = "New round"; nw.onclick = () => { reset(); buzz(10); }; tb.append(nw);
    return () => {};
  }
});

/* ===================================================================
   BOOTSTRAP
=================================================================== */
buildHome();
(function initRoute() {
  if (!canRoute) return;
  const h = (location.hash || "").replace("#", "");
  if (h && GAMES.some(g => g.id === h)) openGame(h);
})();
</script>
